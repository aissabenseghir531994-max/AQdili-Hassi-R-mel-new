<!DOCTYPE html><html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>اقضيلي حاسي الرمل</title>
<style>
body{font-family:Arial,sans-serif;background:#f3f5f7;margin:0;color:#222}
header{background:#087f5b;color:white;padding:24px 15px;text-align:center}
header h1{margin:0 0 8px}
main{max-width:500px;margin:20px auto;padding:15px}
.card{background:white;padding:20px;border-radius:14px;box-shadow:0 2px 8px #ddd}
label{display:block;margin-top:14px;font-weight:bold}
input,select,textarea{width:100%;box-sizing:border-box;padding:12px;margin-top:6px;border:1px solid #ccc;border-radius:8px;font-size:16px}
button{width:100%;padding:14px;margin-top:18px;background:#087f5b;color:white;border:0;border-radius:8px;font-size:17px}
.note{text-align:center;color:#666;font-size:14px}
</style>
</head>
<body>
<header>
<h1>🛵 اقضيلي حاسي الرمل</h1>
<p>خدمات التوصيل إلى غاية باب دارك</p>
</header>
<main>
<div class="card">
<h2>📦 اطلب توصيلك</h2>
<form id="orderForm">
<label>الاسم</label>
<input id="name" required placeholder="اكتب اسمك">
<label>رقم الهاتف</label>
<input id="phone" type="tel" required placeholder="05 أو 06 أو 07">
<label>نوع الطلب</label>
<select id="type" required>
<option value="">اختر نوع الطلب</option>
<option>مشتريات من المحل</option>
<option>وجبة أو مأكولات</option>
<option>أدوية ومنتجات صيدلية</option>
<option>وثائق وأغراض أخرى</option>
</select>
<label>ماذا تريد؟</label>
<textarea id="details" required placeholder="اكتب تفاصيل طلبك"></textarea>
<label>عنوان التوصيل</label>
<input id="address" required placeholder="الحي والشارع">
<label>ملاحظات إضافية (اختياري)</label>
<textarea id="notes" placeholder="أي معلومات إضافية"></textarea>
<button type="submit">إرسال الطلب</button>
</form>
<p class="note">خدمة التوصيل داخل حاسي الرمل فقط.</p>
<p id="message" role="status"></p>
</div>
</main>
<script>
document.getElementById('orderForm').addEventListener('submit',function(e){
e.preventDefault();
const order={
name:document.getElementById('name').value.trim(),
phone:document.getElementById('phone').value.trim(),
type:document.getElementById('type').value,
details:document.getElementById('details').value.trim(),
address:document.getElementById('address').value.trim(),
notes:document.getElementById('notes').value.trim()
};
const text=`طلب جديد - اقضيلي حاسي الرمل\nالاسم: ${order.name}\nالهاتف: ${order.phone}\nالنوع: ${order.type}\nالطلب: ${order.details}\nالعنوان: ${order.address}\nملاحظات: ${order.notes}`;
document.getElementById('message').textContent='تم تجهيز الطلب. اضغط إرسال في واتساب لإكمال الإرسال.';
const url='https://wa.me/213671832087?text='+encodeURIComponent(text);
const link=document.createElement('a');
link.href=url;
link.target='_blank';
link.rel='noopener';
link.textContent='اضغط هنا لإرسال الطلب';
link.style.display='block';
link.style.textAlign='center';
link.style.marginTop='15px';
link.style.fontWeight='bold';
link.style.color='#087f5b';
document.getElementById('message').replaceChildren(link);
});
</script>
</body>
  </html>
