<head>
<meta charset="UTF-8">

<style>
body{font-family:Arial,sans-serif;background:#f3f5f7;margin:0;color:#222}
header{background:#087f5b;color:white;padding:24px 15px;text-align:center}

<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", function () {
    navigator.serviceWorker.register(
      "/AQdili-Hassi-R-mel-new/service-worker.js"
    ).catch(function (error) {
      console.error("Service worker registration failed:", error);
    });
  });

<style>
#installOverlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.65);
  display: flex;
  justify-content: center;
  align-items: center;
  z-index: 99999;
  padding: 20px;
  box-sizing: border-box;
}

#installBox {
  background: white;
  width: 100%;
  max-width: 360px;
  padding: 25px 20px;
  border-radius: 20px;
  text-align: center;
  box-sizing: border-box;
  font-family: Arial, sans-serif;
}

#installBox h2 {
  color: #087f5b;
  margin-top: 0;
}

#installBox p {
  line-height: 1.8;
  color: #444;
}

.installBtn {
  display: block;
  width: 100%;
  box-sizing: border-box;
  padding: 14px;
  margin-top: 12px;
  border: none;
  border-radius: 10px;
  background: #087f5b;
  color: white;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
}

#continueBtn {
  background: #eeeeee;
  color: #333;
}
</style>

<div id="installOverlay">
  <div id="installBox">
    <div style="font-size:55px">🛵</div>

    <h2>اقضيلي حاسي الرمل</h2>

    <p>
      📲 ثبّت تطبيقنا على هاتفك<br>
      واطلب توصيلك بسهولة أينما كنت داخل حاسي الرمل.
    </p>

    <button id="installBtn" class="installBtn">
      📲 تثبيت التطبيق
    </button>

    <button id="continueBtn" class="installBtn">
      متابعة إلى الموقع
    </button>
  </div>
</div>

<script>
(function () {
  const overlay = document.getElementById("installOverlay");
  const installBtn = document.getElementById("installBtn");
  const continueBtn = document.getElementById("continueBtn");

  let installPrompt = null;

  window.addEventListener("beforeinstallprompt", function(event) {
    event.preventDefault();
    installPrompt = event;
  });

  installBtn.addEventListener("click", async function() {
    if (installPrompt) {
      installPrompt.prompt();
      await installPrompt.userChoice;
      installPrompt = null;
    } else {
      alert(
        "لتثبيت التطبيق: افتح قائمة Chrome ⋮، ثم اختر «إضافة إلى الشاشة الرئيسية» أو «تثبيت التطبيق» إذا ظهر الخيار."
      );
    }
  });

  continueBtn.addEventListener("click", function() {
    overlay.style.display = "none";
  });
})();
</script>
  <body>
<header>
<h1>🛵 اقضيلي حاسي الرمل</h1>
<p>خدمات التوصيل إلى غاية باب دارك</p>
</header>

<main>
<div class="card">
<h2>📦 اطلب توصيلك</h2>

<form id="orderForm">

<label>الاسم</label>
<input id="name" required placeholder="اكتب اسمك">

<label>رقم الهاتف</label>
<input id="phone" type="tel" required placeholder="05 أو 06 أو 07">

<label>نوع الطلب</label>
<select id="type" required>
<option value="">اختر نوع الطلب</option>
<option>مشتريات من المحل</option>
<option>وجبة أو مأكولات</option>
<option>أدوية ومنتجات صيدلية</option>
<option>وثائق وأغراض أخرى</option>
</select>

<label>ماذا تريد؟</label>
<textarea id="details" required placeholder="اكتب تفاصيل طلبك"></textarea>

<label>عنوان التوصيل</label>
<input id="address" required placeholder="الحي والشارع">

<label>ملاحظات إضافية (اختياري)</label>
<textarea id="notes" placeholder="أي معلومات إضافية"></textarea>

<button id="submitBtn" type="submit">إرسال الطلب</button>
</form>

<p class="note">خدمة التوصيل داخل حاسي الرمل فقط.</p>
<p id="message" role="status"></p>
</div>
</main>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getFirestore,
  collection,
  addDoc,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCQ45cs4mo3HyjtWAyLbVsh0DglUosoiv0",
  authDomain: "aqdili-hassi-r-mel.firebaseapp.com",
  projectId: "aqdili-hassi-r-mel",
  storageBucket: "aqdili-hassi-r-mel.firebasestorage.app",
  messagingSenderId: "1098910384011",
  appId: "1:1098910384011:web:4bdcfe04af98a0eff2398e",
  measurementId: "G-TSTBHVWBNJ"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const form = document.getElementById("orderForm");
const message = document.getElementById("message");
const button = document.getElementById("submitBtn");

form.addEventListener("submit", async function(e) {
  e.preventDefault();

  const order = {
    name: document.getElementById("name").value.trim(),
    phone: document.getElementById("phone").value.trim(),
    type: document.getElementById("type").value,
    details: document.getElementById("details").value.trim(),
    address: document.getElementById("address").value.trim(),
    notes: document.getElementById("notes").value.trim(),
    status: "جديد",
    createdAt: serverTimestamp()
  };

  const whatsappText =
    `طلب جديد - اقضيلي حاسي الرمل\n` +
    `الاسم: ${order.name}\n` +
    `الهاتف: ${order.phone}\n` +
    `النوع: ${order.type}\n` +
    `الطلب: ${order.details}\n` +
    `العنوان: ${order.address}\n` +
    `ملاحظات: ${order.notes}`;

  const whatsappURL =
    "https://wa.me/213671832087?text=" +
    encodeURIComponent(whatsappText);

  button.disabled = true;
  button.textContent = "جاري تسجيل الطلب...";
  message.textContent = "";

  try {
    await addDoc(collection(db, "orders"), order);

    message.textContent =
      "✅ تم حفظ طلبك بنجاح! اضغط أدناه لإرساله عبر واتساب.";

    message.style.color = "green";

    const link = document.createElement("a");
    link.href = whatsappURL;
    link.target = "_blank";
    link.rel = "noopener";
    link.textContent = "📲 إرسال الطلب عبر واتساب";
    link.style.display = "block";
    link.style.marginTop = "12px";
    link.style.fontWeight = "bold";
    link.style.color = "#087f5b";

    message.appendChild(document.createElement("br"));
    message.appendChild(link);

    form.reset();

  } catch (error) {
    console.error(error);

    message.textContent =
      "❌ تعذر حفظ الطلب. تحقق من اتصال الإنترنت وإعدادات Firebase ثم حاول مجددًا.";

    message.style.color = "red";

  } finally {
    button.disabled = false;
    button.textContent = "إرسال الطلب";
  }
});
</script>

<script>
(function () {
  const btn = document.getElementById("installAppBtn");
  let installPrompt = null;

  window.addEventListener("beforeinstallprompt", function (event) {
    event.preventDefault();
    installPrompt = event;
  });

  btn.addEventListener("click", async function () {
    if (installPrompt) {
      installPrompt.prompt();
      await installPrompt.userChoice;
      installPrompt = null;
    } else {
      alert(
        "لتثبيت التطبيق، اضغط على ⋮ في Chrome ثم اختر تثبيت التطبيق أو إضافة إلى الشاشة الرئيسية."
      );
    }
  });

  window.addEventListener("appinstalled", function () {
